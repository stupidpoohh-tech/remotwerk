<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://www.gstatic.com;
             style-src 'self' 'unsafe-inline';
             img-src 'self' data:;
             connect-src 'self' https://*.firebaseio.com https://*.firebasedatabase.app https://*.googleapis.com wss://*.firebaseio.com;" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <h1>Remotwerk 설정</h1>

  <section>
    <h2>페어링</h2>
    <p class="hint">두 사람이 같은 코드를 입력하면 한 방에 묶입니다. 한쪽이 만들고, 다른 쪽이 입력하세요.</p>
    <div class="row">
      <input id="pairCode" type="text" placeholder="예: LOVE-2451" autocomplete="off" />
      <button id="genCode" class="ghost">코드 생성</button>
    </div>
  </section>

  <section>
    <h2>내 캐릭터</h2>
    <p class="hint">내가 고른 캐릭터가 상대 화면 위에 상주합니다.</p>
    <div id="myGrid" class="grid"></div>
  </section>

  <section>
    <h2>상대 캐릭터 <span class="tag">데모용</span></h2>
    <p class="hint">실제 사용 시엔 상대가 고른 캐릭터가 자동으로 내 화면에 뜹니다. 로컬 데모에서는 여기서 지정할 수 있어요.</p>
    <div id="partnerGrid" class="grid"></div>
  </section>

  <section>
    <h2>Firebase <span class="tag">선택</span></h2>
    <p class="hint">비워 두면 같은 PC 안에서 동작을 확인하는 로컬 데모 모드로 실행됩니다.
      실제 커플 사용 시 Firebase 웹 설정(JSON)을 붙여넣으세요.</p>
    <textarea id="firebase" rows="6" placeholder='{ "apiKey": "...", "databaseURL": "https://...firebasedatabase.app", "projectId": "..." }'></textarea>
  </section>

  <div class="actions">
    <span id="status" class="status"></span>
    <button id="save" class="primary">저장</button>
  </div>

  <script src="../shared/skeleton.js"></script>
  <script src="../shared/gestures.js"></script>
  <script src="../shared/animations.js"></script>
  <script src="../shared/engine.js"></script>
  <script src="../shared/presets.js"></script>
  <script src="../shared/transport.js"></script>
  <script src="settings.js"></script>
</body>
</html>
